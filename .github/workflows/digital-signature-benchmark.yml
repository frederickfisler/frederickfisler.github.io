name: Digital signature benchmark checks

on:
  push:
    paths:
      - "projects/digital-signature-benchmark/**"
      - ".github/workflows/digital-signature-benchmark.yml"
  pull_request:
    paths:
      - "projects/digital-signature-benchmark/**"
      - ".github/workflows/digital-signature-benchmark.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r projects/digital-signature-benchmark/requirements.txt
      - run: python -m unittest discover -s projects/digital-signature-benchmark/tests -v
